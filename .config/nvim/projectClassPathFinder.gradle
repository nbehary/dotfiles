allprojects { project ->
    task kotlinLSPProjectDeps { task ->
        doLast {
            System.out.println ""
            System.out.println "gradle-version $gradleVersion"
            System.out.println "kotlin-lsp-project ${project.name}"

            if (project.hasProperty('android')) {
                // AGP 9+ removed getBootClasspath(). Resolve android.jar directly from SDK.
                def localPropsFile = new File(project.rootDir, 'local.properties')
                def sdkDir = null
                if (localPropsFile.exists()) {
                    def props = new Properties()
                    props.load(localPropsFile.newInputStream())
                    sdkDir = props.getProperty('sdk.dir')
                }
                if (!sdkDir) sdkDir = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
                if (sdkDir) {
                    def compileSdk = project.android.compileSdk
                    def platformsDir = new File("${sdkDir}/platforms")
                    // Match android-37 or android-37.0 style directory names
                    def platformDir = platformsDir.listFiles()?.find { dir ->
                        dir.name == "android-${compileSdk}" || dir.name.startsWith("android-${compileSdk}.")
                    }
                    if (platformDir) {
                        // Only include android.jar — not android-stubs-src.jar (sources, not bytecode),
                        // not core-for-system-modules.jar or uiautomator.jar (unneeded/can corrupt classpath)
                        def androidJar = new File(platformDir, "android.jar")
                        if (androidJar.exists()) {
                            System.out.println "kotlin-lsp-gradle ${androidJar.absolutePath}"
                        }
                    }
                }

                // AGP 9 made libraryVariants/applicationVariants lazy — they return empty at task
                // execution time. Instead, scan configurations directly by name pattern.
                // This works for both simple modules (debugCompileClasspath) and multi-flavor
                // modules (firebaseCtDebugCompileClasspath, etc.)
                def debugConfigs = project.configurations.findAll { cfg ->
                    cfg.canBeResolved &&
                    cfg.name.toLowerCase().endsWith('compileclasspath') &&
                    cfg.name.toLowerCase().contains('debug') &&
                    !cfg.name.toLowerCase().contains('test')
                }.toList().sort { it.name }

                if (!debugConfigs.isEmpty()) {
                    try {
                        // Use lenient artifactView with android-classes-jar type:
                        // - handles AARs (extracts classes from each AAR via Gradle transforms)
                        // - handles inter-module deps (uses the module's compile jar)
                        // - lenient = true skips any unresolvable artifacts
                        debugConfigs[0].incoming.artifactView { viewConfig ->
                            viewConfig.lenient = true
                            viewConfig.attributes {
                                it.attribute(Attribute.of('artifactType', String.class), 'android-classes-jar')
                            }
                        }.artifacts.artifactFiles.files.each { file ->
                            System.out.println "kotlin-lsp-gradle ${file.absolutePath}"
                        }
                    } catch (Exception ignored) { /* best effort */ }
                }
            } else if (project.hasProperty('sourceSets')) {
                // Print the list of all dependencies jar files.
                sourceSets.forEach {
                    it.compileClasspath.forEach {
                        System.out.println "kotlin-lsp-gradle $it"
                    }
                }
            }


            // handle kotlin multiplatform style dependencies if any
            def kotlinExtension = project.extensions.findByName("kotlin")
            if(kotlinExtension && kotlinExtension.hasProperty("targets")) {
                def kotlinSourceSets = kotlinExtension.sourceSets

                // Print the list of all dependencies jar files.
                kotlinExtension.targets.names.each {
                    def classpath = configurations["${it}CompileClasspath"]
                    classpath.files.each {
                        System.out.println "kotlin-lsp-gradle $it"
                    }
                }
            }
        }
    }

    task kotlinLSPAllGradleDeps {
        doLast {
            fileTree("$gradle.gradleHomeDir/lib")
                .findAll { it.toString().endsWith '.jar' }
                .forEach { System.out.println "kotlin-lsp-gradle $it" }
        }
    }
}
